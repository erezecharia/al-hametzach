<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1240">
</head>
<body>
<title>על המצח</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@500;700;900&display=swap">
<style>
/* TV game show at night, always landscape: dark studio, sweeping spotlights, a lit marquee panel for the word, LED scoreboard. Single dark look on purpose. */
:root {
  --night: #0a0a2a;
  --ink: #fff8ec;
  --soft: #b9b2ee;
  --gold: #ffcf3a;
  --gold-deep: #c98a00;
  --yes: #19d57c;
  --no: #ff7a1a;
  --hot: #ff3d8b;
  --cyan: #3fe0ff;
  --display: 'Secular One', 'Rubik', system-ui, sans-serif;
  --ui: 'Rubik', system-ui, sans-serif;
  --W: 100vw; --H: 100vh; --turn: 90deg;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink); font-family: var(--ui); overflow: hidden;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font-family: var(--ui); cursor: pointer; border: 0; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

/* ---------- the studio behind everything ---------- */
.studio { position: fixed; inset: 0; overflow: hidden; pointer-events: none;
  background: radial-gradient(120% 70% at 50% 110%, #3a1a7a 0%, transparent 60%), radial-gradient(90% 60% at 50% -10%, #241a6e, var(--night) 70%); }
.beam { position: absolute; top: -30%; width: 46vmax; height: 160vmax; transform-origin: 50% 0;
  background: linear-gradient(to bottom, rgba(255,240,200,.22), rgba(255,240,200,0) 70%); filter: blur(10px); mix-blend-mode: screen; }
.beam.a { left: 4%; animation: sweepA 7s ease-in-out infinite alternate; }
.beam.b { right: 4%; animation: sweepB 8s ease-in-out infinite alternate; background: linear-gradient(to bottom, rgba(120,200,255,.2), rgba(120,200,255,0) 70%); }
.floor { position: absolute; left: -10%; right: -10%; bottom: -20%; height: 45%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,61,139,.35), transparent); }
@keyframes sweepA { from { transform: rotate(-28deg); } to { transform: rotate(18deg); } }
@keyframes sweepB { from { transform: rotate(26deg); } to { transform: rotate(-16deg); } }

.screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6vmin; text-align: center; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-bottom, 0px)); }
.screen[hidden] { display: none !important; }
/* the whole show is landscape: when the page stays portrait (rotation lock), every screen turns to the way the phone is held */
body.rot .screen { inset: auto; top: 50%; left: 50%; width: var(--H); height: var(--W); transform: translate(-50%, -50%) rotate(var(--turn)); }

/* ---------- logo ---------- */
.logo { font-family: var(--display); font-size: min(11vmin, 84px); line-height: .85; margin: 0; color: var(--gold);
  text-shadow: 0 0 18px rgba(255,207,58,.55), 0 5px 0 var(--gold-deep); transform: rotate(-3deg); }
.logo small { display: block; font-size: .36em; color: var(--ink); text-shadow: 0 0 14px rgba(255,61,139,.8); transform: rotate(3deg); margin-bottom: 4px; letter-spacing: 2px; }
.onair { display: inline-flex; align-items: center; gap: 8px; padding: 4px 11px; border-radius: 6px; border: 2px solid var(--hot); color: var(--hot); font-weight: 900; font-size: 12px; letter-spacing: 3px; }
.onair i { width: 8px; height: 8px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 10px var(--hot); animation: blink 1.2s infinite; }
.top-row { display: flex; align-items: center; gap: 14px; }

/* ---------- home: one landscape screen, no scrolling ---------- */
.decks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.8vmin; width: min(100%, 820px); }
.deck { position: relative; padding: 1.6vmin 1.8vmin; border-radius: 16px; text-align: start; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 11vmin;
  background: linear-gradient(160deg, var(--c), color-mix(in srgb, var(--c) 55%, #000)); color: #fff;
  box-shadow: 0 5px 0 rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35); transition: transform .12s; overflow: hidden; }
.deck::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.25) 45%, transparent 60%); transform: translateX(-120%); animation: shine 4s ease-in-out infinite; animation-delay: var(--d, 0s); }
.deck:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.45); }
.deck b { font-family: var(--display); font-size: min(4.6vmin, 26px); font-weight: 400; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.deck small { font-size: min(2.6vmin, 13px); font-weight: 700; opacity: .85; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.pill { padding: 1.2vmin 2.6vmin; border-radius: 999px; background: rgba(255,255,255,.1); font-weight: 700; font-size: min(3vmin, 15px); border: 1px solid rgba(255,255,255,.12); }
.pill.on { background: var(--gold); color: #2a1a00; border-color: var(--gold); }
.how { color: var(--soft); font-size: min(2.9vmin, 14px); line-height: 1.5; max-width: 60ch; margin: 0; }
.how b { color: var(--ink); }
.best { color: var(--gold); font-weight: 700; font-size: min(2.8vmin, 14px); }
.sound { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); inset-inline-end: max(12px, env(safe-area-inset-right, 0px)); width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.1); font-size: 17px; }

/* ---------- ready ---------- */
.big { font-family: var(--display); font-size: min(8vmin, 52px); line-height: 1.1; margin: 0; }
.go { padding: 1.8vmin 6vmin; border-radius: 999px; background: linear-gradient(180deg, #ffe27a, var(--gold)); color: #2a1a00; font-family: var(--display); font-size: min(6vmin, 32px);
  box-shadow: 0 6px 0 var(--gold-deep), 0 0 34px rgba(255,207,58,.45); }
.go:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--gold-deep); }
.ghost { background: none; color: var(--soft); font-weight: 700; font-size: 15px; text-decoration: underline; text-underline-offset: 4px; }
.phone { width: 120px; height: 66px; border: 5px solid var(--ink); border-radius: 15px; position: relative; animation: tilt 2.6s ease-in-out infinite; box-shadow: 0 0 24px rgba(63,224,255,.35); }
.phone::after { content: 'Aa'; position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 24px; }
.chip { margin: 0; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--soft); font-weight: 700; font-size: 14px; }
.chip.on { background: rgba(25,213,124,.18); color: #8ff0bd; }

/* ---------- countdown ---------- */
.rays { position: absolute; width: 260vmax; height: 260vmax; left: 50%; top: 50%; margin: -130vmax 0 0 -130vmax;
  background: repeating-conic-gradient(rgba(255,207,58,.16) 0 9deg, transparent 9deg 18deg); animation: spin 14s linear infinite; }
.n { position: relative; font-family: var(--display); font-size: min(46vmin, 300px); line-height: 1; color: var(--gold);
  text-shadow: 0 0 40px rgba(255,207,58,.7), 0 10px 0 var(--gold-deep); animation: pop .85s ease-out both; }
.n.go-word { color: var(--hot); font-size: min(30vmin, 220px); text-shadow: 0 0 40px rgba(255,61,139,.8), 0 10px 0 #9b1450; }

/* ---------- play ---------- */
#play { gap: 0; }
#play .flash { position: absolute; inset: 0; opacity: 0; transition: opacity .15s; }
#play.yes .flash { opacity: 1; background: radial-gradient(circle at 50% 45%, #6dffb5, var(--yes) 55%, #0b8a4f); }
#play.no .flash { opacity: 1; background: radial-gradient(circle at 50% 45%, #ffc07a, var(--no) 55%, #b84800); }
.hud { position: absolute; z-index: 3; top: max(8px, env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 10px; pointer-events: none; }
.led { min-width: 72px; padding: 3px 12px 5px; border-radius: 12px; background: #05051a; border: 2px solid rgba(255,255,255,.14); box-shadow: inset 0 0 14px rgba(0,0,0,.8), 0 0 16px rgba(63,224,255,.2); }
.led small { display: block; font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--soft); }
.led b { font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 24px; font-variant-numeric: tabular-nums; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
.led.t b { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
.led.t.hurry { border-color: var(--hot); animation: shake .5s infinite; }
.led.t.hurry b { color: var(--hot); text-shadow: 0 0 12px var(--hot); }
.ribbon { padding: 5px 16px; border-radius: 999px; background: linear-gradient(180deg, var(--hot), #b81d5f); font-weight: 900; font-size: 14px; letter-spacing: 1px; box-shadow: 0 3px 0 #7a0f3d; }
.ribbon.gold { background: linear-gradient(180deg, #fff0a8, var(--gold)); color: #3a2400; box-shadow: 0 3px 0 var(--gold-deep), 0 0 24px rgba(255,207,58,.8); animation: pulse .6s infinite alternate; }
.marquee { position: relative; z-index: 2; width: 82%; height: 58%; display: grid; place-items: center; padding: 3vmin 4vmin; border-radius: 26px;
  background: linear-gradient(180deg, #2a1f78, #140d44); box-shadow: 0 0 0 4px #ffb800, 0 0 0 10px #3b1d00, 0 18px 50px rgba(0,0,0,.6), 0 0 60px rgba(255,207,58,.25); }
.marquee::before, .marquee::after { content: ''; position: absolute; inset: -3px; border-radius: 28px; border: 7px dotted var(--gold); pointer-events: none; }
.marquee::after { border-color: #fff4c4; transform: translateX(7px); opacity: 0; animation: chase .5s steps(1) infinite; }
.marquee::before { animation: chase .5s steps(1) infinite reverse; }
.marquee.gold { background: radial-gradient(circle at 50% 40%, #fff3b0, var(--gold) 60%, #d08f00); }
.marquee.gold .word { color: #3a2400; text-shadow: 0 3px 0 rgba(255,255,255,.6); }
.word { font-family: var(--display); font-size: min(15vmin, 150px); line-height: 1.05; margin: 0; text-wrap: balance; max-width: 100%; text-shadow: 0 4px 0 rgba(0,0,0,.35); }
.word.long { font-size: min(10.5vmin, 110px); }
.word.in { animation: slam .38s cubic-bezier(.2,1.4,.4,1) both; }
.verdict { position: absolute; z-index: 4; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: min(26vmin, 220px); pointer-events: none; opacity: 0; text-shadow: 0 8px 0 rgba(0,0,0,.25); }
.verdict.on { animation: stamp .6s ease-out both; }
.zone { position: absolute; z-index: 1; left: 0; right: 0; height: 50%; display: flex; justify-content: center; font-weight: 900; font-size: 13px; letter-spacing: 1px; color: rgba(255,255,255,.3); pointer-events: none; }
.zone.top { top: 0; align-items: flex-start; padding-top: 4px; }
.zone.bot { bottom: 0; align-items: flex-end; padding-bottom: 12px; }
.streak { position: absolute; z-index: 3; bottom: 14px; inset-inline-start: max(18px, env(safe-area-inset-left, 0px)); font-family: var(--display); font-size: 22px; color: var(--gold); text-shadow: 0 0 12px rgba(255,207,58,.8); }
.combo { position: absolute; z-index: 5; top: 14%; left: 50%; transform: translateX(-50%); font-family: var(--display); font-size: min(12vmin, 90px); color: var(--gold);
  text-shadow: 0 5px 0 var(--gold-deep), 0 0 34px rgba(255,207,58,.8); white-space: nowrap; pointer-events: none; opacity: 0; }
.combo.on { animation: combo 1.2s ease-out both; }
.plus { position: absolute; z-index: 5; font-family: var(--display); font-size: 46px; pointer-events: none; animation: float .9s ease-out both; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
.bar { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 7px; background: rgba(255,255,255,.1); }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--hot), var(--gold)); transform-origin: 100% 50%; box-shadow: 0 0 12px var(--gold); }

/* Bumba, the show's little host */
.bumba { position: absolute; z-index: 3; bottom: 8px; inset-inline-end: max(14px, env(safe-area-inset-right, 0px)); width: 70px; height: 70px; pointer-events: none; }
.bumba .body { position: absolute; inset: 10px 6px 0; background: var(--hot); border-radius: 50% 50% 44% 44% / 58% 58% 42% 42%; box-shadow: inset -8px -10px 0 rgba(0,0,0,.2); animation: bob 1.6s ease-in-out infinite; transform-origin: 50% 100%; }
.bumba .eye { position: absolute; top: 26%; width: 15px; height: 19px; background: #fff; border-radius: 50%; }
.bumba .eye::after { content: ''; position: absolute; width: 7px; height: 9px; background: #14093a; border-radius: 50%; top: 6px; left: 4px; transition: transform .2s; }
.bumba .eye.l { left: 22%; } .bumba .eye.r { right: 22%; }
.bumba .mouth { position: absolute; left: 50%; top: 60%; width: 20px; height: 9px; margin-left: -10px; border-bottom: 4px solid #14093a; border-radius: 0 0 20px 20px; transition: all .2s; }
.bumba.happy .body { animation: jump .7s cubic-bezier(.3,1.6,.5,1) both; }
.bumba.happy .mouth { height: 15px; background: #14093a; border-radius: 0 0 22px 22px; }
.bumba.sad .body { animation: faint .8s ease-in both; }
.bumba.sad .eye::after { transform: scaleY(.2); }
.bumba.sad .mouth { border-bottom: 0; border-top: 4px solid #14093a; border-radius: 20px 20px 0 0; top: 66%; }
.bumba.big { position: relative; inset: auto; width: min(22vmin, 120px); height: min(22vmin, 120px); }
.bumba.big .eye { width: 26%; height: 30%; } .bumba.big .eye::after { width: 45%; height: 45%; top: 35%; left: 28%; }
.bumba.big .mouth { width: 30%; margin-left: -15%; }
.bumba.dance .body { animation: dance .5s ease-in-out infinite alternate; }

/* ---------- results ---------- */
.res { display: flex; align-items: center; gap: 4vmin; }
.board { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 1.4vmin 4vmin 2vmin; border-radius: 22px; background: #05051a; border: 3px solid rgba(255,207,58,.5); box-shadow: 0 0 40px rgba(255,207,58,.25), inset 0 0 30px rgba(0,0,0,.8); }
.board small { font-size: 11px; font-weight: 700; letter-spacing: 3px; color: var(--soft); }
.score { font-family: 'Rubik', sans-serif; font-weight: 900; font-size: min(20vmin, 140px); line-height: .95; color: var(--gold); text-shadow: 0 0 24px rgba(255,207,58,.8); margin: 0; font-variant-numeric: tabular-nums; }
.rank { font-family: var(--display); font-size: min(6.5vmin, 38px); margin: 0; }
.stats { color: var(--soft); font-weight: 700; font-size: min(2.9vmin, 15px); margin: 0; }
.list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 90%; max-height: 20vmin; overflow: hidden; }
.list span { padding: 4px 11px; border-radius: 999px; font-weight: 700; font-size: min(2.8vmin, 15px); }
.list .y { background: rgba(25,213,124,.18); color: #8ff0bd; }
.list .n { background: rgba(255,122,26,.16); color: #ffc38f; text-decoration: line-through; text-decoration-thickness: 2px; }
.list .g { background: rgba(255,207,58,.22); color: var(--gold); }

/* recording: a small live mirror and a REC light during the round; the clip on the results screen */
.cam { position: absolute; z-index: 3; bottom: 14px; left: 50%; transform: translateX(-50%); padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.25); }
.cam video { position: absolute; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
.cam i { display: flex; align-items: center; gap: 5px; font-style: normal; font-size: 12px; font-weight: 900; color: #fff; letter-spacing: 2px; }
.cam i::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #ff2d55; box-shadow: 0 0 6px #ff2d55; animation: blink 1s infinite; }
.res .clip { height: min(34vmin, 220px); aspect-ratio: 16 / 9; border-radius: 14px; background: #000; border: 3px solid rgba(255,207,58,.5); object-fit: contain; }
.share { padding: 1.2vmin 3vmin; border-radius: 999px; background: linear-gradient(180deg, #ff6aa8, var(--hot)); font-weight: 900; font-size: min(3.4vmin, 17px); box-shadow: 0 4px 0 #9b1450; }
.share:active { transform: translateY(3px); box-shadow: 0 1px 0 #9b1450; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 8; }
.hapt { position: fixed; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }

@keyframes pop { 0% { transform: scale(2.6); opacity: 0; } 30% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes slam { 0% { transform: scale(1.7) rotate(-5deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes stamp { 0% { transform: scale(2.4) rotate(-14deg); opacity: 0; } 25% { transform: scale(1) rotate(-6deg); opacity: 1; } 80% { opacity: 1; } 100% { transform: scale(1.05) rotate(-6deg); opacity: 0; } }
@keyframes combo { 0% { transform: translateX(-50%) scale(.3) rotate(-10deg); opacity: 0; } 25% { transform: translateX(-50%) scale(1.15) rotate(3deg); opacity: 1; } 70% { opacity: 1; } 100% { transform: translateX(-50%) translateY(-40px); opacity: 0; } }
@keyframes float { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translateY(-10px) scale(1.2); } 100% { transform: translateY(-90px); opacity: 0; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
@keyframes bob { 0%,100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-4px) scale(.97, 1.03); } }
@keyframes jump { 0% { transform: scale(1.25, .7); } 40% { transform: translateY(-40px) scale(.85, 1.2) rotate(-12deg); } 70% { transform: translateY(0) scale(1.2, .8); } 100% { transform: none; } }
@keyframes faint { 0% { transform: none; } 30% { transform: rotate(14deg); } 60% { transform: rotate(-80deg) translateY(10px); } 100% { transform: rotate(-90deg) translateY(14px); } }
@keyframes dance { 0% { transform: rotate(-12deg) scale(1.05, .95); } 100% { transform: rotate(12deg) translateY(-14px) scale(.95, 1.05); } }
@keyframes tilt { 0%,100% { transform: rotate(0); } 25% { transform: rotateX(50deg); } 60% { transform: rotateX(-50deg); } }
@keyframes chase { 0% { opacity: 1; } 50% { opacity: 0; } }
@keyframes blink { 50% { opacity: .2; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shine { 0%, 60% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
@keyframes pulse { to { transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
</style>

<div class="studio" aria-hidden="true"><div class="beam a"></div><div class="beam b"></div><div class="floor"></div></div>
<label class="hapt" aria-hidden="true" id="haptLabel"><input type="checkbox" switch tabindex="-1"></label>

<section id="home" class="screen">
  <button class="sound" id="soundBtn" aria-label="סאונד">🔊</button>
  <div class="top-row"><span class="onair"><i></i>בשידור חי</span></div>
  <h1 class="logo"><small>המשחק של</small>על המצח</h1>
  <div class="decks" id="decks"></div>
  <div class="row" id="times"></div>
  <div class="row"><button class="pill" id="recBtn"></button></div>
  <p class="how"><b>מורידים את הטלפון קדימה</b> = ניחשתי · <b>מרימים אחורה</b> = דלג · אפשר גם להחליק</p>
  <p class="best" id="best"></p>
</section>

<section id="ready" class="screen" hidden>
  <div class="phone" aria-hidden="true"></div>
  <p class="big">הטלפון על המצח, לרוחב</p>
  <p class="how">המסך מול החברים. <b>קדימה</b> = ניחשתי, <b>אחורה</b> = דלג.</p>
  <p class="chip" id="tiltState">ההטיה עוד לא פעילה · אפשר גם להחליק</p>
  <button class="go" id="goBtn">יאללה!</button>
  <button class="ghost" id="backBtn">חזרה</button>
</section>

<section id="count" class="screen" hidden><div class="rays" aria-hidden="true"></div><div class="n" id="countN">3</div></section>

<section id="play" class="screen" hidden>
  <div class="flash"></div>
  <div class="hud">
    <div class="led t" id="timerBox"><small>זמן</small><b id="timer">60</b></div>
    <span class="ribbon" id="cat"></span>
    <div class="led"><small>נקודות</small><b id="score">0</b></div>
  </div>
  <div class="zone top">↑ דלג</div>
  <div class="zone bot">ניחשתי ↓</div>
  <div class="combo" id="combo"></div>
  <div class="marquee" id="marquee"><p class="word" id="word"></p></div>
  <div class="verdict" id="verdict"></div>
  <div class="streak" id="streak"></div>
  <div class="bumba" id="bumba"><div class="body"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div></div>
  <div class="cam" id="cam" hidden><video id="camVid" playsinline muted autoplay></video><i>REC</i></div>
  <div class="bar"><i id="barFill"></i></div>
</section>

<section id="done" class="screen" hidden>
  <div class="res">
    <div class="bumba big" id="bumbaBig"><div class="body"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div></div>
    <div class="board"><small>התוצאה</small><p class="score" id="finalScore">0</p></div>

const RANKS = [[0, 'המצח עוד ישן'], [3, 'מתחמם'], [6, 'מצח של כסף'], [10, 'מצח של זהב'], [14, 'קורא מחשבות'], [19, 'אגדה של מסיבות'], [25, 'אלוהי המצח']];

// ---------- recording: the front camera, the word and the score burned in, the room's laughs and the game's sounds ----------
// nothing leaves the phone: the clip lives in memory until it is saved or the page is closed
const R = { stream: null, rec: null, chunks: [], url: null, blob: null, raf: 0, flash: null, final: null, canvas: null, ready: false };
async function camOpen() {
  clipReset();
  if (R.stream) { recStart(); return; }
  try {
    R.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: { echoCancellation: false, noiseSuppression: false } });
  } catch (e) {
    try { R.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false }); } catch (e2) { R.stream = null; }
  }
  if (!R.stream) { note('אין גישה למצלמה, משחקים בלי צילום'); return; }
  const v = $('camVid'); v.srcObject = R.stream; try { await v.play(); } catch (e) { /* ignore */ }
  recStart();
}
function recStart() {
  if (!R.stream || !window.MediaRecorder) return;
  const a = audio();
  const W = 1280, H = 720, c = R.canvas || (R.canvas = document.createElement('canvas')); c.width = W; c.height = H;
  const g = c.getContext('2d'), v = $('camVid');
  const tracks = c.captureStream(30).getVideoTracks();
  if (a) {   // the game's sounds and the room's microphone, mixed into the clip (the mic is not played out loud)
    const dest = a.createMediaStreamDestination(); master.connect(dest);
    const mics = R.stream.getAudioTracks();
    if (mics.length) { const src = a.createMediaStreamSource(new MediaStream(mics)), mg = a.createGain(); mg.gain.value = 1.4; src.connect(mg).connect(dest); }
    R.dest = dest; tracks.push(...dest.stream.getAudioTracks());
  }
  const types = ['video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  const type = types.find((t) => { try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; } }) || '';
  try { R.rec = new MediaRecorder(new MediaStream(tracks), type ? { mimeType: type, videoBitsPerSecond: 3500000 } : undefined); } catch (e) { R.rec = null; return; }
  R.chunks = []; R.type = R.rec.mimeType || type || 'video/mp4';
  R.rec.ondataavailable = (e) => { if (e.data && e.data.size) R.chunks.push(e.data); };
  R.rec.onstop = () => { R.blob = new Blob(R.chunks, { type: R.type }); R.url = URL.createObjectURL(R.blob); R.ready = true; showClip(); };
  R.rec.start(500);
  $('cam').hidden = false;
  const draw = () => {
    R.raf = requestAnimationFrame(draw);
    g.fillStyle = '#0a0a2a'; g.fillRect(0, 0, W, H);
    if (v.videoWidth) {
      // the camera frame follows the phone; turn it like the screen so people stand upright, mirrored like a selfie
      const turned = rotated(), vw = turned ? v.videoHeight : v.videoWidth, vh = turned ? v.videoWidth : v.videoHeight;
      const k = Math.max(W / vw, H / vh);
      g.save(); g.translate(W / 2, H / 2); g.scale(-1, 1); if (turned) g.rotate(turn * Math.PI / 180);
      g.drawImage(v, -v.videoWidth * k / 2, -v.videoHeight * k / 2, v.videoWidth * k, v.videoHeight * k); g.restore();
    }
    // the show on top: the word on a lit band, time and score
    const word = G ? G.q[G.i].w : (R.final != null ? `התוצאה: ${R.final}` : $('countN').textContent);
    g.fillStyle = 'rgba(20,13,68,.86)'; g.fillRect(0, 0, W, 132);
    g.fillStyle = '#ffcf3a'; g.fillRect(0, 132, W, 6);
    g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = "84px 'Secular One', Rubik, sans-serif"; g.fillStyle = '#fff8ec'; g.fillText(word, W / 2, 70, W - 330);
    if (G) {
      g.font = "900 44px Rubik, sans-serif"; g.fillStyle = '#ffcf3a'; g.textAlign = 'left'; g.direction = 'ltr';
      g.fillText(String(Math.ceil(Math.max(0, G.end - performance.now()) / 1000)), 40, 70);
      g.textAlign = 'right'; g.fillStyle = '#3fe0ff'; g.fillText(String(G.score), W - 40, 70);
    }
    const f = R.flash;
    if (f && performance.now() - f.t < 700) {
      const a2 = 1 - (performance.now() - f.t) / 700;
      g.fillStyle = f.ok ? `rgba(25,213,124,${0.45 * a2})` : `rgba(255,122,26,${0.45 * a2})`; g.fillRect(0, 138, W, H - 138);
      g.save(); g.translate(W / 2, H * 0.6); g.rotate(-0.1); g.globalAlpha = Math.min(1, a2 * 1.6);
      g.direction = 'rtl'; g.textAlign = 'center'; g.font = "150px 'Secular One', Rubik, sans-serif"; g.fillStyle = '#fff'; g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 10;
      g.strokeText(f.txt, 0, 0); g.fillText(f.txt, 0, 0); g.restore();
    }
    g.font = "700 22px Rubik, sans-serif"; g.fillStyle = 'rgba(255,255,255,.7)'; g.textAlign = 'right'; g.direction = 'rtl'; g.fillText('על המצח', W - 24, H - 26);
  };
  draw();
}
function recStop() {
  cancelAnimationFrame(R.raf); $('cam').hidden = true;
  try { if (R.rec && R.rec.state !== 'inactive') R.rec.stop(); } catch (e) { /* ignore */ }

async function shareClip() {

let noteT = 0;

// ---------- input ----------
// swipe and tap, measured along the show's own up/down even when it is turned sideways
let d0 = null;
const rotated = () => document.body.classList.contains('rot');
function along(dx, dy) { if (!rotated()) return dy; return turn === 90 ? -dx : dx; }
function inLowerHalf(x, y) { if (!rotated()) return y > innerHeight / 2; return turn === 90 ? x < innerWidth / 2 : x > innerWidth / 2; }
$('play').addEventListener('pointerdown', (e) => { d0 = { y: e.clientY, x: e.clientX }; });
$('play').addEventListener('pointerup', (e) => {
  if (!d0 || !G) return;
  const dx = e.clientX - d0.x, dy = e.clientY - d0.y, a = along(dx, dy); d0 = null;
  if (Math.abs(a) > 45) { answer(a > 0); return; }
  if (Math.abs(dx) < 15 && Math.abs(dy) < 15) answer(inLowerHalf(e.clientX, e.clientY));
});
addEventListener('keydown', (e) => {
  if (!G) return;
  if (e.key === 'ArrowDown' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); answer(true); }
  else if (e.key === 'ArrowUp' || e.key === 'Backspace') { e.preventDefault(); answer(false); }
});
// tilt: nz = how much the screen faces the ceiling (+1) or the floor (-1); upright on the forehead is about 0
let neutral = true, tiltLive = false, tiltAsked = false;
function onTilt(e) {
  if (e.beta == null || e.gamma == null) return;
  if (!tiltLive) { tiltLive = true; const t = $('tiltState'); t.textContent = 'ההטיה פעילה ✓'; t.classList.add('on'); }
  const r = Math.PI / 180, nz = Math.cos(e.beta * r) * Math.cos(e.gamma * r);
  // which long edge points up decides which way the show turns (only while the page is portrait); never mid-round
  const xUp = -Math.cos(e.beta * r) * Math.sin(e.gamma * r);
  if (!G && Math.abs(nz) < 0.7 && Math.abs(xUp) > 0.6) { const t2 = xUp > 0 ? 90 : -90; if (t2 !== turn) { turn = t2; applyTurn(); } }
  if (!G) return;
  if (Math.abs(nz) < 0.35) { neutral = true; return; }
  if (!neutral) return;

  else if (nz > 0.6) { neutral = false; answer(false); }
}
function askTilt() {
  if (tiltAsked) return; tiltAsked = true;
  try {
    const D = window.DeviceOrientationEvent;
    if (D && typeof D.requestPermission === 'function') D.requestPermission().then((s) => { if (s === 'granted') addEventListener('deviceorientation', onTilt); else tiltAsked = false; }).catch(() => { tiltAsked = false; });
    else if (D) addEventListener('deviceorientation', onTilt);

}
